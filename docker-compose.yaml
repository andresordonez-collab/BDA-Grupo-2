services:
  postgres-db:
    build:
      context: ./Base_De_Datos
      dockerfile: Dockerfile
    container_name: bda_grupo2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    # Carga pg_cron en memoria y lo vincula a la base de datos del proyecto
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Base_De_Datos/DB.sql:/docker-entrypoint-initdb.d/01_DB.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Codigo_Fuente/backend
      dockerfile: Dockerfile
    container_name: bda_grupo2_backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    ports:
      - "${BACKEND_PORT}:8080"

  frontend:
    build:
      context: ./Codigo_Fuente/frontend
      dockerfile: Dockerfile
    container_name: bda_grupo2_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:5173"

volumes:
  pgdata: